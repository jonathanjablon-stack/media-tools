name: CarStream Build Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [carstream-mvp]
    paths:
      - 'CarStream/**'
      - 'carstream-bootstrap/**'
      - '.github/workflows/carstream-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: carstream-mvp
      - name: Complete Android project
        run: |
          bash carstream-bootstrap/01-config.sh
          bash carstream-bootstrap/02-files.sh
          mkdir -p CarStream/app/src/main/res/values
          cat > CarStream/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">CarStream</string></resources>
          EOF
          cat > CarStream/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><resources><style name="AppTheme" parent="android:style/Theme.Material.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#5B8CFF</item><item name="android:navigationBarColor">#0C1017</item><item name="android:statusBarColor">#0C1017</item></style></resources>
          EOF
          cat > CarStream/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/><uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="32"/><uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE"/><uses-permission android:name="android.permission.WAKE_LOCK"/>
            <application android:theme="@style/AppTheme" android:label="CarStream" android:usesCleartextTraffic="true" android:allowBackup="false"><activity android:name=".HostActivity" android:screenOrientation="portrait" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><service android:name=".HostService" android:exported="false" android:foregroundServiceType="connectedDevice"/></application>
          </manifest>
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and capture results
        id: compile
        continue-on-error: true
        run: |
          mkdir -p dist
          set +e
          (cd CarStream && gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace) > dist/build.log 2>&1
          code=$?
          echo "$code" > dist/build-exit-code.txt
          if [ "$code" = 0 ]; then
            echo SUCCESS > dist/build-status.txt
            cp CarStream/app/build/outputs/apk/debug/app-debug.apk dist/CarStream-debug.apk
            zip -qr dist/CarStream-source.zip CarStream README.md BUILD_STATUS.md TEST_REPORT.md 2>/dev/null || zip -qr dist/CarStream-source.zip CarStream
            sha256sum dist/CarStream-debug.apk dist/CarStream-source.zip > dist/SHA256SUMS.txt
          else
            echo FAILED > dist/build-status.txt
          fi
      - name: Commit diagnostic output
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f dist
          git commit -m 'Update CarStream build diagnostic' || exit 0
          git push origin HEAD:carstream-mvp
