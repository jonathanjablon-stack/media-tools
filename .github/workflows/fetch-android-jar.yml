name: Fetch Android API 35 Jar

on:
  workflow_dispatch:
  push:
    branches: [carstream-libvlc-fetch]
    paths:
      - '.github/workflows/fetch-android-jar.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35'
      - name: Copy and verify platform jar
        shell: bash
        run: |
          set -euo pipefail
          cp "$ANDROID_HOME/platforms/android-35/android.jar" android-35.jar
          test "$(stat -c%s android-35.jar)" -gt 20000000
          sha256sum android-35.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-api-35-jar
          path: |
            android-35.jar
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
