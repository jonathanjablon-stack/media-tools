name: Temporary RetroArch Firestick Core Pack

on:
  push:
    branches:
      - retroarch-firestick-pack-temp-2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify official Libretro cores
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/retroarch-cores"
          mkdir -p "$ROOT/arm64-v8a" "$ROOT/armeabi-v7a"

          cores=(
            fceumm_libretro_android.so.zip
            snes9x_libretro_android.so.zip
            genesis_plus_gx_libretro_android.so.zip
            fbneo_libretro_android.so.zip
            mame2003_plus_libretro_android.so.zip
          )

          for abi in arm64-v8a armeabi-v7a; do
            base="https://buildbot.libretro.com/nightly/android/latest/${abi}"
            for core in "${cores[@]}"; do
              echo "Downloading ${abi}/${core}"
              curl --fail --location --retry 4 --retry-delay 2 \
                --output "$ROOT/$abi/$core" "$base/$core"
              unzip -t "$ROOT/$abi/$core"
            done
          done

          cat > "$ROOT/README.txt" <<'EOF'
Official Libretro Android core archives for RetroArch.

Included systems:
- NES: FCEUmm
- SNES: Snes9x
- Sega Master System, Genesis, Sega CD, and Game Gear: Genesis Plus GX
- Arcade: FinalBurn Neo and MAME 2003-Plus

Architectures:
- arm64-v8a
- armeabi-v7a

No ROMs or BIOS files are included.
EOF

          find "$ROOT" -type f -name '*.zip' -print0 | sort -z | xargs -0 sha256sum > "$ROOT/SHA256SUMS.txt"

      - name: Upload verified core pack
        uses: actions/upload-artifact@v4
        with:
          name: retroarch-firestick-cores
          path: retroarch-cores
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
